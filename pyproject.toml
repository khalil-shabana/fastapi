[project]
name = "awesome-project"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.143.3",
    "jinja2>=3.1.6",
    "psycopg[binary]>=3.3.6",
    "psycopg2-binary>=2.9.13",
    "sqlalchemy>=2.1.6",
    "sqlmodel>=0.0.48",
    "pydantic[email]>=2.14.1",
    "email-validator>=2.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt==4.0.1",
    "python-jose[cryptography]>=3.5.0",
    "pyjwt[crypto]>=2.15.1",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.16.0",
    "alembic>=1.20.1",
]

[tool.fastapi]
entrypoint = "main:app"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]      # let tests import modules from the project root
testpaths = ["tests"]
